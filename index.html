<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Agency Web-Page</title>
</head>
<style>
    html, body{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        overflow: hidden;
    }
    #container{
        height: 40.625rem;
        width: 100%;
    }
    #container img{
        height: 100%;
        width: 100%;
    }
    .contain{
        height: 3.125rem;
        width: 100%;
        margin-top: -40.625rem;
        padding: 1.25rem .625rem;
        display: flex;
        justify-content: space-around;
        align-items: center;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }
    .logo{
        font-size: 2.2rem;
        color: white;
    }
    .nav-bar a{
        text-decoration: none;
        font-size: 1.25rem;
        color: white;
        padding: 0.625rem 1.25rem;
    }
    .nav-bar a:hover{
        color: aqua;
        border-bottom: 0.125rem solid cyan;
        width: 100%;
    }
    .reg a{
        text-decoration: none;
        font-size: 1rem;
        color: white;
        padding: 0.1875rem 1.25rem;
        background-color: rgb(231, 21, 63);
        border-radius: 0.5rem;
    }
    .reg a:hover{
        background-color: yellowgreen;
        color: white;
    }
    #box{
        position: relative;
        text-align: center;
    }
    #box h5{
        margin-top: 10rem;
        font-size: 1rem;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        color: white;
        letter-spacing: 0.1rem;
        padding: 3px 0;
    }
    #box h1{
        font-family: Arial, Helvetica, sans-serif;
        color: white;
        margin-top: -1.25rem;
    }
    #box a{
        text-decoration: none;
        color: white;
        font-size: 0.875rem;
        background-color: rgb(231, 21, 63);
        padding: 0.4375rem 1.25rem;
        letter-spacing: 0.1875rem;
        border-radius: 0.3125rem;
    }
    #box a:hover{
        background-color: orangered;
    }
    @media (max-width:2560px){
        #container{
            height: 86rem;
        }
        .contain{
            height: 5.125rem;
            margin-top: -82.625rem;
        }
        .logo{
            font-size: 4.125rem;
        }
        .nav-bar a{
            text-decoration: none;
            font-size: 2.5rem;
            color: white;
            padding: .9375rem 1.875rem;
        }
        .reg a{
            font-size: 2.2rem;
        }
        #box h5{
            margin-top: 300px;
            font-size: 2rem;
        }
        #box h1{
            font-size: 4rem;
        }
        #box a{
            font-size: 2rem;
            padding: 0.4375rem 1.25rem;
        }
    }
    @media (max-width:1440px){
        .contain{
            margin-top: -86.625rem;
        }
        .logo{
            font-size: 2rem;
        }
        .nav-bar a{
            font-size: 1.3rem;
            padding: .75rem 1.5625rem;
        }
        .reg a{
            font-size: 1.3rem;
        }
        #box h5{
            margin-top: 9.375rem;
            font-size: 1.3rem;
        }
        #box h1{
            font-size: 2.3rem;
        }
        #box a{
            font-size: 1.3rem;
        }  
    }
    @media (max-width:1024px){
        #container{
            height: 37.5rem;
        }
        .contain{
            margin-top: -37.625rem;
        }
        .logo{
            font-size: 1.8rem;        
        }
        .nav-bar a{
            font-size: 1rem;
            padding: .75rem 1.25rem;
        }
        .reg a{
            font-size: 1rem;
        }
        #box h5{
            margin-top: 6.5rem;
            font-size: 1rem;
            padding: .625rem 0;
        }
        #box h1{
            font-size: 1.8rem;
        }
        #box a{
            font-size: .8rem;
            padding: .625rem 1.25rem;
        }
    }
    @media (max-width:768px){
        #container{
            height: 36.25rem;
        }
        .contain{
            margin-top: -37.625rem;
        }
        .logo{
            font-size: 1.5rem;        
        }
        .nav-bar a{
            font-size: .8125rem;
            padding: .625rem .9375rem;
        }
        .reg a{
            font-size: .8125rem;
        }
        #box h5{
            margin-top: 5rem;
            font-size: .8125rem;
            padding: .625rem 0;
        }
        #box h1{
            font-size: 1.5rem;
        }
        #box a{
            font-size: .7rem;
            padding: .5rem .75rem;
        }
    }
    @media (max-width:585px){
        #container{
            height: 36.25rem;
        }
        .contain{
            margin-top: -37.625rem;
        }
        .logo{
            font-size: 1.5rem;        
        }
        .nav-bar a{
            font-size: .8rem;
        }
        .reg a{
            font-size: .8rem;
            padding: 2px 10px;
            border-radius: 5px;
        }
        #box h5{
            font-size: .8rem;
            padding: 5px 2px;
        }
        #box h1{
            font-size: 1.5rem;
        }
        #box a{
            font-size: .7rem;
        }
    }
    @media (max-width:557px){
        #container{
            height: 36.25rem;
        }
        .contain{
            margin-top: -37.625rem;
        }
        .logo{
            font-size: 1.3rem;        
        }
        .nav-bar a{
            font-size: .6rem;
            padding: 2px 7px;
        }
        .reg a{
            font-size: .6rem;
            padding: 2px 8px;
            border-radius: 5px;
        }
        #box h5{
            font-size: .8rem;
            padding: 5px 2px;
        }
        #box h1{
            font-size: 1.5rem;
        }
        #box a{
            font-size: .7rem;
        }
    }
    @media (max-width:425px){
        #container{
            height: 34.25rem;
        }
        .contain{
            margin-top: -35.625rem;
        }
        .logo{
            font-size: 1rem;
            white-space: nowrap; 
        }
        .nav-bar a{
            font-size: .625rem;
            padding: .125rem .1875rem;
        }
        .reg a{
            font-size: .625rem;   
        }
        #box h5{
            margin-top: 4rem;
            font-size: .625rem;
            padding: .625rem 0;
        }
        #box h1{
            font-size: 1.2rem;
        }
        #box a{
            font-size: .625rem;            
            padding: .5rem .75rem;
        }
    }
    @media (max-width:375px){
        #container{
            height: 34.25rem;
        }
        .contain{
            margin-top: -36rem;
        }
        .logo{
            font-size: .8rem;
            white-space: nowrap; 
        }
        .nav-bar a{
            font-size: .5rem;
        }
        .reg a{
            font-size: .5rem;  
            border-radius: .3125rem; 
        }
        #box h5{
            margin-top: 4rem;
            font-size: .5rem;
            padding: .625rem 0;
        }
        #box h1{
            font-size: 1.2rem;
        }
        #box a{
            font-size: .6rem;            
            padding: 0.3125rem 0.3125rem;
        }
    }
</style>
<body>
    <div id="container">
        <img src="nature.jpg" alt="nature">
        <div class="contain">
            <div class="logo">
                Travel-R
            </div>
            <div class="nav-bar">
                <a href="#">Home</a>
                <a href="#">Hill Stations</a>
                <a href="#">Best Offer's</a>
                <a href="#">Our Sites</a>
                <a href="#">Contact</a>
            </div>
            <div class="reg">
                <a href="#">Register</a>
            </div>
        </div>
        <div id="box">
            <h5>Enjoy</h5>
            <h1>INTERNATIONAL TRAVEL <br> AGENCY</h1>
            <a href="#">Book Your Trip </a>
        </div>
    </div>    
</body>
</html>
